# Scala 3 typeclass

<img src="./img/scala-logo.svg" alt="Scala" width="15%" />

(... an experimental journey among that funny stuff)

**Implicit, variance, type constraints & higher kinds**

---

<!-- .slide: class="decomposed" -->

<h2>Typeclass <code>Show</code>:<br /><em>Context (or pretense)</em></h2>

- Consider a supported type without modifying it
- Specify the behaviour to show a textual representation for the type
- Basically `T => String`
- ~Customizable `toString`

<img src="./img/1-commence.gif" alt="Allez, on commence" 
  style="position:absolute;top:80%;right:0;border-radius:5px" />

---

<!-- .slide: class="decomposition" -->

Usage: 

```scala
// Scala 2 (compatible Scala 3)

def showAndGo[T](value: T)(using show: Show[T]): T = {
  println(s"DEBUG: ${show(value)}")
  value
}

doSomething(showAndGo("foo"))
```

---

<!-- .slide: class="decomposed" -->

<h2>Typeclass <code>Show</code>:<br /><em>Declaration, factory<br />& basic instances</em></h2>

```scala
trait Show[T] {
  def apply(value: T): String
}

object Show extends DefaultShow {
  def apply[T](f: T => String): Show[T] = new Show[T] {
    def apply(value: T): String = f(value)
  }
}

// ... Next slide: Default Show
```

---

<!-- .slide: class="decomposition" -->

```scala
sealed trait DefaultShow {
  implicit object IntShow extends Show[Int] {
    def apply(value: Int): String = s"int(${value.toString})"
  }

  given strShow: Show[String] = Show[String](identity)
}
```

*See [full source](https://gist.github.com/cchantep/ea3d7cb6b9b2e29209dbc01c0ef83a9f#gistcomment-6339305)*<br />
(paste in REPL or [scatie](https://scastie.scala-lang.org/) to try the coming examples)

## Implicit resolution

Test resolution of a basic instance, using `implicitly` function:

```scala
scala> summon[Show[String]]
res: Show[String] = Show$$anon$1@492699bb
```

<img src="./img/2-super.gif" alt="D'accord, alors ça c'est super... Sinon ?!" />

---

<!-- .slide: class="decomposed" -->

<h2 id="show-any-iterable">Show <em>instance for any <code>Iterable</code></em></h2>

[Naive approach](https://gist.github.com/cchantep/ea3d7cb6b9b2e29209dbc01c0ef83a9f#gistcomment-6339305): support any `Iterable[A]`, if type `A` is itself provided a `Show[A]` instance

```scala
given iterableShow[A](using w: Show[A]): Show[Iterable[A]] =
  Show[Iterable[A]] { ta =>
    ta.map(w(_)).mkString
  }
```

---

<!-- .slide: class="decomposition" -->

```scala
scala> Show.iterableShow[String].apply(List("foo"))
res: String = foo

scala> summon[Show[Iterable[String]]]
res: Show[Iterable[String]] = Show$$anon$1@17952225

scala> summon[Show[List[String]]]
-- [E172] Type Error: ----------------------------------
1 |summon[Show[List[String]]]
  |                          ^
  |No given instance of type Show[List[String]] was found for parameter x of method summon in object Predef
1 error found
```

**Cause**: trait `Show[T]` is *invariant*, so even if `List <: Iterable`, `iterableShow` cannot be resolved for.

---

<!-- .slide: class="decomposed" -->

### Let's try a contravariant `Show`

Keep `iterableShow` unchanged as

```scala
given iterableShow[A](using w: Show[A]): Show[Iterable[A]] =
  Show[Iterable[A]] { ta =>
    ta.map(w(_)).mkString
  }
```

… but [update `Show` trait](https://gist.github.com/cchantep/ea3d7cb6b9b2e29209dbc01c0ef83a9f#gistcomment-6339305) to be *contravariant*:

```scala
trait Show[-T/* ⬅️ */] { def apply(value: T): String }
```

---

<!-- .slide: class="decomposition" -->

Retry the previously failing resolution:

```scala
scala> summon[Show[List[String]]]
res: Show[List[String]] = Show$$anon$1@3a73d37f

scala> summon[Show[List[String]]].apply(List("foo"))
res: String = foo
```

![Pas de problème](./img/3-pas-de-probleme-alors.gif)

---

<!-- .slide: class="decomposition" -->

### Resolution issue due to contravariance

Case of sealed family:

```scala
sealed trait Family

case object Member1 extends Family

case class Member2(v: String) extends Family
```

---

<!-- .slide: class="decomposition" -->

```scala
object Family {
  given show: Show[Family] = Show[Family] {
    case Member1 => {
      val show1 = summon[Show[Member1.type]] /* ⬅️ */

      s"Family(${show1(Member1)})"
    }

    case m: Member2 => {
      val show2 = summon[Show[Member2]] /* ⬅️ */

      s"Family(${show2(m)})"
    }
  }
}
```

---

<!-- .slide: class="decomposition" -->

Let's try it ...

```scala
scala> summon[Show[Family]].apply(Member2("foo"))
java.lang.StackOverflowError
  at Family$.$anonfun$show$1(<pastie>:44)
  at Show$$anon$1.apply(<pastie>:17)
  at Family$.$anonfun$show$1(<pastie>:46)
  at Show$$anon$1.apply(<pastie>:17)
```

![Oh, mais quel con](./img/4-con.gif)

---

<!-- .slide: class="decomposed" -->

### Add missing `Show` instances

Declare specific instances `member1Show` and `member2Show`, and use them to implement `familyShow`.

```scala
given member1Show: Show[Member1.type] =
  Show[Member1.type] { _ => "Member1" }

given member2Show: Show[Member2] =
  Show[Member2] { m => s"Member2(${m.v})" }
```

---

<!-- .slide: class="decomposition" -->

… still resolve `familyShow` instead of the more specific instances:

```scala
scala> summon[Show[Member2]].apply(Member2("foo"))
java.lang.StackOverflowError ⬅️
  at Show$$anon$1.apply(<pastie>:35)
  at $anonfun$familyShow$1.apply(<pastie>:45)
  at $anonfun$familyShow$1.apply(<pastie>:43)
```

---

<!-- .slide: class="decomposed" -->

### Work around the contravariance issue?

Update `familyShow` to directly call the instances `member{1,2}Show` without implicit resolution:

```scala
given familyShow: Show[Family] = Show[Family] {
  case Member1 => s"Family(${member1Show(Member1)})"
  case m: Member2 => s"Family(${member2Show(m)})"
}
```

---

<!-- .slide: class="decomposition" -->

… still not suﬃcient:

```scala
scala> summon[Show[Member2]].apply(Member2("foo"))
res: String = Family(Member2(foo))
// ... not “Member2(foo)” from member2Show ⬅️
```

… still resolve `familyShow` instead of more specific instance (there `member2Show`);

Could be ok, except if we want `x: Member2` (explicitly known a `Member2`) to be encoded with specific `Show`, different from when the same `x` is just known as a `Family` instance.

---

<!-- .slide: class="decomposed" -->

### Better implicit parameters?

With `Show` instances for subtypes resolved as implicit parameters, rather than using `summon`.

```scala
given familyShow(using _1: Show[Member1.type], // ⬅️
  _2: Show[Member2]): Show[Family] = Show[Family] {
  case Member1 => _1.apply(Member1)
  case m: Member2 => _2.apply(m)
}
```

---

<!-- .slide: class="decomposed decomposition" -->

This time, the specific instance is resolved,

```scala
scala> summon[Show[Member2]].apply(Member2("foo"))
res: String = Member2(foo)
```

but …

---

<!-- .slide: class="decomposition" -->

… now it’s weird for the parent type `Family`:

```scala
scala> summon[Show[Family]].apply(Member2("foo"))
res: String = Member2(foo)
// ... not Family(Member2(foo)) ⬅️
```

<img src="./img/5-fourbe.gif" width="40%"
 alt="C'est pas pour rien qu'on m'appelle le fourbe !" />

---

<!-- .slide: class="decomposed" -->

### Implicit objects

Let's try to define `Show` instances as objects:

```scala
implicit object Member1Show extends Show[Member1.type] {
  def apply(m: Member1.type): String = "Member1"
}

implicit object Member2Show extends Show[Member2] {
  def apply(m: Member2): String = s"Member2(${m.v})"
}

given familyShow: Show[Family] = Show[Family] {
  case Member1 => s"Family(${Member1Show(Member1)})"
  case m: Member2 => s"Family(${Member2Show(m)})"
}
```

---

<!-- .slide: class="decomposition" -->

… raise ambiguity issue for implicit resolution

```scala
scala> summon[Show[Member2]]
-- [E172] Type Error: ----------------------------------
1 |summon[Show[Member2]]
  |                     ^
  |Ambiguous given instances: both object Member2Show and given instance
  familyShow match type Show[Member2] of parameter x
  of method summon in object Predef
1 error found
```

<img src="./img/6-veines.gif" width="30%"
  alt="Ça vous ennuie si je me taille les veines ?" />

---

<!-- .slide: class="decomposed" -->

### Revert to invariant `Show`

```scala
trait Show[T] {
  def apply(value: T): String
}
```

Then *everything is ok* for sealed family …

<!-- .slide: class="decomposed decomposition" -->

```scala
scala> summon[Show[Member2]].apply(Member2("foo"))
res: String = Member2(foo)

scala> summon[Show[Family]].apply(Member2("foo"))
res: String = Family(Member2(foo))
```

---

<!-- .slide: class="decomposition" -->

… but come back to [issue for `iterableShow`](#show-any-iterable):

```scala
scala> summon[Show[List[String]]]
-- [E172] Type Error: ----------------------------
1 |summon[Show[List[String]]]
  |                          ^
  |No given instance of type Show[List[String]]
  was found for parameter x of method summon in object Predef
1 error found
```

---

<!-- .slide: class="decomposed" -->

### Try generic type constraints for `iterableShow`

Define a Show instance of any `T <: Iterable[_]`:

```scala
given iterableShow[A, T <: Iterable[_]](using w: Show[A]): Show[T] = ???
```

---

<!-- .slide: class="decomposition" -->

… but it doesn’t help the implicit resolution:

```scala
scala> summon[Show[List[String]]]
-- [E172] Type Error: -----------------------------------
1 |summon[Show[List[String]]]
  |                          ^
  |No best given instance of type Show[List[String]] was found
  ...
```

![Oh](./img/7-oh.gif)

### Higher kinds to the rescue

Specify a `Show` instance of any `Iterable M` whose *type constructor* accept one *type parameter*:

```scala
import scala.language.higherKinds

given iterableShow[A, M[_] <: Iterable[_]/* ⬅️ */](
  using s: Show[A]): Show[M[A]] = sys.error("resolved")
```

… now the resolution seems ok:

```scala
scala> summon[Show[List[String]]]
java.lang.RuntimeException: resolved
```

---

<!-- .slide: class="decomposed" -->

### First implementation with higher kinds

For now `iterableShow` is resolvable but not implemented, let’s give it a first try:

```scala
given iterableShow[A, M[_] <: Iterable[_]](
  using w: Show[A]): Show[M[A]] = 
  Show[M[A]] { (as: M[A]) =>
    as.map { (a: A) =>
      w(a)
    }.mkString
  }
```

---

<!-- .slide: class="decomposed decomposition" -->

… but it fails to compile:

```scala
-- [E007] Type Mismatch Error: ----------------
4 |    as.map { (a: A) =>
  |             ^
  |             Found:    A => String
  |             Required: Any => String
  ...
```

---

<!-- .slide: class="decomposed decomposition" -->

Different meaning of `_` in type expression `M[_] <: Iterable[_]`,

-  in `M[_]` : type constructor with one unnamed type parameter,
-  in `Iterable[_]` : similar to `Iterable[Any]`<br /> <small>(like `?` in Java generics, doesn't require `scala.language.higherKinds`)</small>

---

<!-- .slide: class="decomposition" -->

... it lacks of evidence that `_` in `Iterable[_]` can be `A` when using applying `M[A]`.

![Vous suivez sire ?](./img/8-suivez.gif)

---

### Fix high kinds implementations

Specify it with `M[T] <: Iterable[T]` to guarantee that with `M[A]` the `Iterable` operations are parameterized with the “same” `A`.

```scala
given iterableShow[A, M[T] <: Iterable[T]](
  using w: Show[A]): Show[M[A]] = Show[M[A]] { as =>
    as.map { (a: A) =>
      w(a)
    }.mkString
  }
```

… it compiles, let’s test it ... 🙏

---

### Test the high kinds implementation

First the newly implemented `iterableShow`,

```scala
scala> summon[Show[List[String]]].apply(List("foo"))
res: String = foo

scala> summon[Show[Set[String]]].apply(Set("bar"))
res: String = bar
```

… then check there is no regression for the sealed family:

```scala
scala> summon[Show[Member2]].apply(Member2("foo"))
res: String = Member2(foo)

scala> summon[Show[Family]].apply(Member2("foo"))
res: String = Family(Member2(foo))
```

---

### Finally everything is ok

![Wow](./img/9-wow.gif)
