Database

- <!-- .element: class="expanded focused" --><strong>Column-family oriented:</strong>
  - **1 family** : set of rows
  - **1 key per row** : simple or composite (n columns)
  - **Value(s) per key** : not queryable
  - **Fixed schema** : same structure for all rows

Database

- Column-family oriented
- <!-- .element: class="expanded focused" --><strong>Distributed:</strong>

<!-- .slide: class="decomposed" -->

- <!-- .element: class="expanded focused" --><strong>CQL</strong>: SQL-like
  - Low barrier to entry for SQL users
  - Syntax and grammar validation tools (tests)

```sql
INSERT INTO a_table(foo, bar, lorem) VALUES(1, 2, '..');
UPDATE a_table SET foo = 1 WHERE lorem = '..'; -- !upsert
DELETE FROM a_table WHERE foo = 2;
```

---

<!-- .slide: class="decomposed decomposition" -->

- CQL
- <!-- .element: class="expanded focused" --><strong>Batch</strong>: Economies of scale
  - Reuse resources for multiple queries<br><small>Example : Reduce network round trips, I/O</small>
  - Guarantee atomicity <small>(si une seule partition)</small>
  - Not magic: do not generalize <small>(especially across multiple partitions)</small>

```sql
BATCH
  INSERT INTO merchant(country, brand, ..)
  VALUES ('FR', 'IM', ..);

  INSERT INTO merchant(country, brand, ..)
  VALUES ('FR', 'EM', '..');
APPLY BATCH;
```

Cases where you really should <small>not</small> use it?

- <!-- .element: class="focused expanded" -->Development
  - **Multi-filter search**: strict key order<br><small>Example : Store: Country/Brand/...</small>

---

<!-- .slide: class="decomposed" -->

![](img/11-col-filtering.step1.svg)

**Search by Country**: 👌

```sql
SELECT * FROM a_table WHERE Country = 'FR';
```

---

<!-- .slide: class="decomposed decomposition" -->

![](img/11-col-filtering.step2.svg)

**Search by Country and Brand**: 👌

```sql
SELECT * FROM a_table WHERE Country = 'FR' AND Brand = 'IM';
```

---

<!-- .slide: class="decomposition" -->

![](img/11-col-filtering.step3.svg)

**Search by Brand**: ❌

```sql
SELECT * FROM a_table WHERE Brand = 'IM';
```

Cannot filter by `Brand` without `Country`.

Cases where you really should <small>not</small> use it?

- <!-- .element: class="expanded" -->Development
  - <!-- .element: class="expanded" -->Multi-filter search
    - <!-- .element: class="focused" --><strong>Allow filtering</strong>: Client-side filtering; discouraged

<blockquote>When your query is rejected by Cassandra because it needs filtering, you should resist the urge to just add <tt>ALLOW FILTERING</tt> to it.</blockquote>

Cases where you really should <small>not</small> use it?

- <!-- .element: class="expanded" -->Development
  - Multi-filter search
  - <!-- .element: class="expanded focused" --><strong>Range search</strong>: range query
    - The criterion must be part of the *clustering key*
    - A column can only be filtered if the previous one is also filtered (by equality)
    - A criterion cannot be added if the previous column is a range query

---

<!-- .slide: class="decomposed decomposition" -->

- <!-- .element: class="expanded" -->Development
  - Multi-filter search
  - Range search
  - <!-- .element: class="expanded focused" --><strong>Heterogeneous distribution</strong>: depending on the use case
    - Reduced parallelism
    - I/O cache overflow
    - “A priori” partitioning<br>(vs rollover ElasticSearch); <small>Example: article/PDF</small>
    - Workaround using <i>synthetic sharding</i>
