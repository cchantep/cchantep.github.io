<!-- .slide: class="decomposed" -->

- <!-- .element: class="expanded focused" --><strong>CQL</strong>: SQL like
  - Ticket d'entrée faible pour les habitués SQL
  - Outils de validation syntaxe et grammaire (tests)

```sql
INSERT INTO a_table(foo, bar, lorem) VALUES(1, 2, '..');
UPDATE a_table SET foo = 1 WHERE lorem = '..'; -- !upsert
DELETE FROM a_table WHERE foo = 2;
```

---

<!-- .slide: class="decomposed decomposition" -->

- CQL
- <!-- .element: class="expanded focused" --><strong>Batch</strong>: Économie d'échelle
  - Réutiliser ressources pour plusieurs requêtes<br><small>Exemple : Réduire roundtrip réseau, I/O</small>
  - Garantir l'atomicité <small>(si une seule partition)</small>
  - Pas magique : à ne pas généraliser <small>(surtout en multi-partitions)</small>

```sql
BATCH
  INSERT INTO merchant(country, brand, ..)
  VALUES ('FR', 'IM', ..);

  INSERT INTO merchant(country, brand, ..)
  VALUES ('FR', 'EM', '..');
APPLY BATCH;
```

  - Recherche multi-filtres
  - <!-- .element: class="expanded focused" --><strong>Recherche par intervalles</strong>: range query
    - Le critère doit faire partie de la *clustering key*
    - On ne peut filtrer une colonne que si la précédente est aussi filtrée (en égalité)
    - On ne peut pas rajouter un critère si la colonne précédente est une range query
